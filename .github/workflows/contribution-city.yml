name: Update Contribution City

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-city:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Contribution City SVG
        run: python3 .github/scripts/generate_city.py "${{ github.repository_owner }}" -o contribution-city.svg

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contribution-city.svg
          git diff --cached --quiet || (git commit -m "chore: update contribution city [skip ci]" && git push)
