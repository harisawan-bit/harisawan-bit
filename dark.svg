<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="320" viewBox="0 0 1180 320" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" role="img" aria-label="Haris Awan — operations console">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A101F"/>
      <stop offset="1" stop-color="#0B1322"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#A78BFA;#10B981;#22D3EE" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#22D3EE;#A78BFA;#10B981" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22D3EE" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1180" height="320" fill="url(#bg)"/>
  <rect width="1180" height="320" fill="url(#grid)"/>

  <!-- radar sweep -->
  <rect x="-260" y="0" width="260" height="320" fill="url(#sweep)">
    <animate attributeName="x" values="-260;1180" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- HUD corner brackets -->
  <g stroke="#22D3EE" stroke-opacity="0.55" stroke-width="2" fill="none">
    <path d="M14 30 V14 H30"/>
    <path d="M1150 14 H1166 V30"/>
    <path d="M1166 290 V306 H1150"/>
    <path d="M30 306 H14 V290"/>
  </g>

  <!-- classification strip -->
  <text x="40" y="26" font-size="11" letter-spacing="2" fill="#64748B">PERSONAL OPERATIONS NETWORK // UNCLASSIFIED</text>
  <text x="1140" y="26" font-size="11" letter-spacing="2" fill="#64748B" text-anchor="end">GRID 33.68N 073.05E // ISLAMABAD</text>
  <line x1="14" y1="38" x2="1166" y2="38" stroke="#22D3EE" stroke-opacity="0.25"/>

  <!-- prompt + identity -->
  <text x="60" y="100" font-size="15" fill="#22D3EE">&gt; whoami</text>
  <rect x="152" y="86" width="10" height="18" fill="#22D3EE">
    <animate attributeName="opacity" values="1;0" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <text x="57" y="166" font-size="60" font-weight="800" letter-spacing="4" fill="#F8FAFC">HARIS AWAN</text>
  <rect x="60" y="186" width="240" height="3" fill="url(#acc)"/>
  <text x="60" y="220" font-size="15" letter-spacing="1" fill="#94A3B8">AUTONOMOUS AGENTS &#183; RESEARCH TOOLING &#183; EVIDENCE SYNTHESIS</text>
  <text x="60" y="248" font-size="12" fill="#64748B">MBBS &#8212; systems discipline applied to clinical research and machine intelligence</text>

  <!-- telemetry module -->
  <rect x="880" y="64" width="286" height="192" rx="8" fill="#0C1426" stroke="#22D3EE" stroke-opacity="0.3"/>
  <text x="900" y="90" font-size="11" letter-spacing="3" fill="#22D3EE">TELEMETRY</text>
  <line x1="900" y1="100" x2="1146" y2="100" stroke="#22D3EE" stroke-opacity="0.2"/>

  <text x="900" y="122" font-size="11" fill="#64748B">FOCUS</text>
  <line x1="985" y1="119" x2="1050" y2="119" stroke="#64748B" stroke-dasharray="2 3"/>
  <text x="1146" y="122" font-size="11" fill="#F8FAFC" text-anchor="end">AGENT SYSTEMS</text>

  <text x="900" y="146" font-size="11" fill="#64748B">DOMAIN</text>
  <line x1="985" y1="143" x2="1050" y2="143" stroke="#64748B" stroke-dasharray="2 3"/>
  <text x="1146" y="146" font-size="11" fill="#F8FAFC" text-anchor="end">EVIDENCE SYNTHESIS</text>

  <text x="900" y="170" font-size="11" fill="#64748B">LEAD LANG</text>
  <line x1="985" y1="167" x2="1050" y2="167" stroke="#64748B" stroke-dasharray="2 3"/>
  <text x="1146" y="170" font-size="11" fill="#F8FAFC" text-anchor="end">TYPESCRIPT</text>

  <text x="900" y="194" font-size="11" fill="#64748B">STATUS</text>
  <line x1="985" y1="191" x2="1050" y2="191" stroke="#64748B" stroke-dasharray="2 3"/>
  <rect x="1058" y="185" width="6" height="6" fill="#10B981">
    <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="1146" y="194" font-size="11" fill="#10B981" text-anchor="end">OPERATIONAL</text>

  <!-- load bars -->
  <text x="900" y="216" font-size="10" letter-spacing="2" fill="#475569">SYS.ACTIVITY</text>
  <g>
    <rect x="900"  y="238" width="10" height="10" fill="#22D3EE" opacity="0.7"><animate attributeName="height" values="10;20;10" dur="1.8s" repeatCount="indefinite"/><animate attributeName="y" values="238;228;238" dur="1.8s" repeatCount="indefinite"/></rect>
    <rect x="925"  y="226" width="10" height="22" fill="#A78BFA" opacity="0.6"><animate attributeName="height" values="22;12;22" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y" values="226;236;226" dur="1.6s" repeatCount="indefinite"/></rect>
    <rect x="950"  y="232" width="10" height="16" fill="#22D3EE" opacity="0.7"><animate attributeName="height" values="16;26;16" dur="2.1s" repeatCount="indefinite"/><animate attributeName="y" values="232;222;232" dur="2.1s" repeatCount="indefinite"/></rect>
    <rect x="975"  y="220" width="10" height="28" fill="#A78BFA" opacity="0.6"><animate attributeName="height" values="28;16;28" dur="1.7s" repeatCount="indefinite"/><animate attributeName="y" values="220;232;220" dur="1.7s" repeatCount="indefinite"/></rect>
    <rect x="1000" y="236" width="10" height="12" fill="#10B981" opacity="0.6"><animate attributeName="height" values="12;22;12" dur="1.9s" repeatCount="indefinite"/><animate attributeName="y" values="236;226;236" dur="1.9s" repeatCount="indefinite"/></rect>
    <rect x="1025" y="228" width="10" height="20" fill="#22D3EE" opacity="0.7"><animate attributeName="height" values="20;10;20" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="228;238;228" dur="1.5s" repeatCount="indefinite"/></rect>
    <rect x="1050" y="234" width="10" height="14" fill="#A78BFA" opacity="0.6"><animate attributeName="height" values="14;24;14" dur="2.2s" repeatCount="indefinite"/><animate attributeName="y" values="234;224;234" dur="2.2s" repeatCount="indefinite"/></rect>
    <rect x="1075" y="222" width="10" height="26" fill="#22D3EE" opacity="0.7"><animate attributeName="height" values="26;14;26" dur="1.8s" repeatCount="indefinite"/><animate attributeName="y" values="222;234;222" dur="1.8s" repeatCount="indefinite"/></rect>
  </g>

  <!-- status footer -->
  <line x1="14" y1="282" x2="1166" y2="282" stroke="#22D3EE" stroke-opacity="0.25"/>
  <rect x="40" y="296" width="7" height="7" fill="#10B981"/>
  <text x="54" y="304" font-size="11" letter-spacing="1" fill="#94A3B8">SYS NOMINAL</text>
  <rect x="180" y="296" width="7" height="7" fill="#10B981"/>
  <text x="194" y="304" font-size="11" letter-spacing="1" fill="#94A3B8">CI PASSING</text>
  <rect x="320" y="296" width="7" height="7" fill="#22D3EE"/>
  <text x="334" y="304" font-size="11" letter-spacing="1" fill="#94A3B8">SEC HARDENED</text>
  <text x="1140" y="304" font-size="11" letter-spacing="2" fill="#64748B" text-anchor="end">SESSION // PERSISTENT</text>
</svg>
