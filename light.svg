<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="320" viewBox="0 0 1180 320" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" role="img" aria-label="Haris Awan">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2F7"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"><animate attributeName="stop-color" values="#7C3AED;#0891B2;#059669;#7C3AED" dur="10s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#059669"><animate attributeName="stop-color" values="#059669;#7C3AED;#0891B2;#059669" dur="10s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#0891B2" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0891B2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#0891B2"/>
    </pattern>
  </defs>

  <rect width="1180" height="320" fill="url(#bg)"/>
  <rect width="1180" height="320" fill="url(#glow)"/>
  <rect width="1180" height="320" fill="url(#dots)" opacity="0.07"/>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0s" fill="freeze"/>
    <text x="60" y="152" font-size="64" font-weight="800" fill="#0F172A" letter-spacing="2">HARIS AWAN</text>
    <text x="62" y="196" font-size="20" fill="#475569">Software Developer &#183; MBBS &#183; Autonomous Agents &amp; Research Tooling</text>
    <rect x="60" y="222" width="180" height="4" rx="2" fill="url(#acc)"/>
    <text x="60" y="266" font-size="13" fill="#7C3AED">~/harisawan-bit &#8212; building in public</text>
  </g>
</svg>
