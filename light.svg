      </stop>
    </linearGradient>
    <pattern id="gridL" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0891B2" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="sweepL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891B2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0891B2" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#0891B2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1180" height="320" fill="url(#bgL)"/>
