<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="320" viewBox="0 0 1180 320" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" role="img" aria-label="Haris Awan — operations console">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F7FB"/>
    </linearGradient>
    <linearGradient id="accL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891B2">
        <animate attributeName="stop-color" values="#0891B2;#7C3AED;#059669;#0891B2" dur="12s" repeatCount="indefinite"/>
